[package]
name = "vault-crypto"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "vault-crypto-cli"
path = "src/main.rs"

[features]
default = []
wasm = ["wasm-bindgen", "getrandom"]
mobile = ["uniffi"]

[dependencies]
aes-gcm = "0.10.3"
argon2 = "0.5.3"
hex = "0.4.3"
hex-literal = "1.1.0"
hkdf = "0.12.4"
rand = "0.10.0"
rand_core = "0.10.0"
sha2 = "0.10.9"

# Optional: WASM support
wasm-bindgen = { version = "0.2", optional = true }
getrandom = { version = "0.3", features = ["wasm_js"], optional = true }

# Optional: Mobile FFI (UniFFI)
uniffi = { version = "0.29", optional = true }
